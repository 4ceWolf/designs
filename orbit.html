<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit — radial player</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:#05060a; color:#eaf0ff; overflow:hidden; font:14px/1.4 "Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .orbit{ position:fixed; inset:0; display:grid; place-items:center; }
  .orbit::before{ content:""; position:absolute; inset:0; background:
    radial-gradient(50% 50% at 50% 42%, rgba(90,150,255,.10), transparent 70%),
    radial-gradient(40% 40% at 80% 80%, rgba(255,90,150,.07), transparent 70%); }
  .ring{ position:absolute; width:0; height:0; }
  .cover{ position:absolute; width:150px; height:150px; margin:-75px 0 0 -75px; border-radius:16px; background-size:cover;
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.08); will-change:transform,opacity; }
  .cover .lbl{ position:absolute; left:0; right:0; bottom:-26px; text-align:center; font-size:11px; letter-spacing:.4px; color:#9fb0cc; opacity:0; transition:.3s; }
  .cover.front .lbl{ opacity:1; }
  .core{ position:relative; z-index:3; width:340px; height:340px; display:grid; place-items:center; text-align:center;
    border-radius:50%; background:radial-gradient(circle at 50% 35%, rgba(20,26,40,.9), rgba(6,8,14,.96)); box-shadow:0 0 0 1px rgba(255,255,255,.06),0 40px 90px rgba(0,0,0,.7); }
  .core svg{ position:absolute; inset:0; }
  .core .eyebrow{ font-size:10px; letter-spacing:2.4px; text-transform:uppercase; color:#2ad4ff; }
  .core h1{ margin:8px 0 4px; font-size:30px; font-weight:800; letter-spacing:-.8px; }
  .core .artist{ font-size:14px; color:#9fb0cc; }
  .core .time{ margin-top:10px; font-size:11px; color:#5b657e; font-variant-numeric:tabular-nums; }
  .brand{ position:fixed; top:26px; left:30px; z-index:4; }
  .brand b{ font-size:15px; letter-spacing:6px; text-transform:uppercase; }
  .brand span{ display:block; font-size:9px; letter-spacing:3px; color:#5b657e; margin-top:2px; }
  .hud{ position:fixed; bottom:26px; left:0; right:0; display:flex; justify-content:center; gap:26px; z-index:4; font-size:11px; color:#5b657e; letter-spacing:1px; }
  .hud b{ color:#eaf0ff; font-weight:600; }
</style>
</head>
<body>
<div class="brand"><b>Orbit</b><span>radial library</span></div>
<div class="orbit">
  <div class="ring" id="ring"></div>
  <div class="core">
    <svg id="prog" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1.5"/><circle id="arc" cx="50" cy="50" r="47" fill="none" stroke="#2ad4ff" stroke-width="1.5" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="295.3" stroke-dashoffset="295.3" style="filter:drop-shadow(0 0 6px #2ad4ff)"/></svg>
    <div>
      <div class="eyebrow" id="eyebrow">Now orbiting</div>
      <h1 id="title">Red Thread</h1>
      <div class="artist" id="artist">Mira Vale</div>
      <div class="time"><span id="cur">0:00</span> · <span id="dur">4:18</span></div>
    </div>
  </div>
</div>
<div class="hud"><span>SCROLL / DRAG TO SPIN</span><span>·</span><span><b id="idx">01</b> / 10</span></div>

<script>
(function(){
  "use strict";
  var TRACKS = [
    ["Red Thread","Mira Vale"],["Afterimage","North Index"],["Still Water","Ana Lune"],["Pale Distance","Common Field"],
    ["Intervals","North Index"],["Soft Machines","Ana Lune"],["Contour Lines","Common Field"],["Nightbook","Ludovico Einaudi"],
    ["Horizon","James Heather"],["Kerala","Bonobo"]
  ];
  function hash(n){ var s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
  var HUES=[[2,76,54],[190,72,50],[150,60,44],[260,70,58],[40,80,56],[320,66,56],[210,80,58],[120,60,46],[0,0,60],[286,70,60]];
  function art(i){ var h=HUES[i%HUES.length];
    return "radial-gradient(60% 60% at 30% 25%, hsl("+h[0]+" "+h[1]+"% "+(h[2]+16)+"%), transparent 62%),"+
           "radial-gradient(60% 60% at 74% 72%, hsl("+((h[0]+40)%360)+" "+h[1]+"% "+(h[2]-6)+"%), transparent 62%),"+
           "linear-gradient(150deg, hsl("+h[0]+" "+h[1]+"% "+h[2]+"%), hsl("+((h[0]+60)%360)+" "+h[1]+"% "+(h[2]-22)+"%))"; }

  var ring=document.getElementById("ring");
  var N=TRACKS.length, R=Math.min(window.innerWidth,window.innerHeight)*0.34;
  var items=[];
  for(var i=0;i<N;i++){
    var d=document.createElement("div"); d.className="cover"; d.style.backgroundImage=art(i);
    d.innerHTML='<div class="lbl">'+TRACKS[i][0]+'</div>';
    (function(i){ d.addEventListener("click",function(){ target=(i*360/N); }); })(i);
    ring.appendChild(d); items.push(d);
  }
  var angle=0, target=0, vel=0, dragging=false, lastX=0, auto=0.09;
  document.addEventListener("pointerdown",function(e){ dragging=true; lastX=e.clientX; });
  document.addEventListener("pointermove",function(e){ if(dragging){ var dx=e.clientX-lastX; lastX=e.clientX; target+=dx*0.35; } });
  document.addEventListener("pointerup",function(){ dragging=false; });
  document.addEventListener("wheel",function(e){ e.preventDefault(); target+=e.deltaY*0.12; },{passive:false});

  var dur=258000, pos=0, t0=performance.now(), arc=document.getElementById("arc"), cur=document.getElementById("cur");
  var title=document.getElementById("title"), artist=document.getElementById("artist"), idxEl=document.getElementById("idx");
  var front=-1;

  function fmt(ms){ var s=Math.floor(ms/1000),m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
  function frame(ts){
    requestAnimationFrame(frame);
    var dt=Math.min(48,ts-(frame._p||ts)); frame._p=ts;
    if(!dragging){ target += auto*dt/16; }
    angle += (target-angle)*0.08;
    pos += dt*16; if(pos>dur) pos=0;
    var step=360/N;
    for(var i=0;i<N;i++){
      var a=(angle+i*step)*Math.PI/180;
      var x=Math.sin(a)*R, y=-Math.cos(a)*R*0.62;
      var depth=(Math.cos(a)+1)/2;             /* 1 = front */
      var sc=0.62+depth*0.5, op=0.28+depth*0.72;
      var z=Math.round(depth*100);
      items[i].style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) scale("+sc.toFixed(3)+")";
      items[i].style.opacity=op.toFixed(3);
      items[i].style.zIndex=z;
      items[i].style.filter=depth>0.85?"brightness(1.05)":"brightness(.7)";
      var isFront=depth>0.985;
      items[i].classList.toggle("front",isFront);
      if(isFront && front!==i){ front=i; title.textContent=TRACKS[i][0]; artist.textContent=TRACKS[i][1]; idxEl.textContent=String(i+1).padStart(2,"0"); }
    }
    arc.setAttribute("stroke-dashoffset",(295.3*(1-pos/dur)).toFixed(1));
    cur.textContent=fmt(pos);
  }
  requestAnimationFrame(frame);
  window.addEventListener("resize",function(){ R=Math.min(window.innerWidth,window.innerHeight)*0.34; });
})();
</script>
</body>
</html>
