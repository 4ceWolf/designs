<!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Echo — Aura</title>
<style>
  :root{
    --bg:#fbfbfd; --sidebar:rgba(245,245,247,.85); --panel:#ffffff; --panel2:#f5f5f7; --raise:#ffffff;
    --text:#1d1d1f; --sec:#6e6e73; --ter:#86868b;
    --sep:rgba(0,0,0,.10); --sep2:rgba(0,0,0,.06);
    --accent:#0a84ff; --accent-ink:#0071e3; --accent-soft:rgba(10,132,255,.12);
    --good:#30a46c; --warn:#e5a50a; --bad:#e5484d; --violet:#5e5ce6;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.07);
    --shadow-sm:0 1px 2px rgba(0,0,0,.05);
    --track:rgba(0,0,0,.12); --fill:rgba(0,0,0,.5);
    --font:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue","Inter",system-ui,sans-serif;
    --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,monospace;
  }
  html[data-theme="dark"]{
    --bg:#0a0a0c; --sidebar:rgba(20,20,22,.85); --panel:#141416; --panel2:#1c1c1e; --raise:#1c1c1e;
    --text:#f5f5f7; --sec:#98989d; --ter:#636366;
    --sep:rgba(255,255,255,.11); --sep2:rgba(255,255,255,.06);
    --accent:#0a84ff; --accent-ink:#409cff; --accent-soft:rgba(10,132,255,.18);
    --good:#30a46c; --warn:#e5a50a; --bad:#e5484d; --violet:#5e5ce6;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.5);
    --shadow-sm:0 1px 3px rgba(0,0,0,.4);
    --track:rgba(255,255,255,.14); --fill:rgba(255,255,255,.6);
  }
  html[data-theme="oled"]{ --bg:#000; --sidebar:rgba(8,8,9,.9); --panel:#0b0b0c; --panel2:#151517; }
  html[data-motion="reduced"] *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  html[data-motion="minimal"] *{ animation:none !important; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; overflow:hidden; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  input{ font:inherit; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--track); border-radius:9px; border:2px solid transparent; background-clip:padding-box; }
  .app{ display:flex; height:calc(100vh - 92px); }

  /* sidebar */
  .sidebar{ width:236px; flex:0 0 236px; background:var(--sidebar); backdrop-filter:saturate(160%) blur(20px); -webkit-backdrop-filter:saturate(160%) blur(20px);
    border-right:1px solid var(--sep); padding:12px 10px; display:flex; flex-direction:column; gap:1px; overflow-y:auto; }
  .brand{ display:flex; align-items:center; gap:9px; padding:6px 8px 14px; font-size:15px; font-weight:700; letter-spacing:-.02em; }
  .brand .mk{ width:24px; height:24px; border-radius:7px; background:linear-gradient(150deg,var(--accent),var(--violet)); display:grid; place-items:center; box-shadow:0 2px 8px var(--accent-soft); }
  .nav{ display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:8px; font-size:13.5px; font-weight:500; color:var(--text); cursor:pointer; }
  .nav svg{ width:17px; height:17px; flex:0 0 auto; color:var(--ter); }
  .nav:hover{ background:var(--sep2); }
  .nav.on{ background:var(--accent-soft); }
  .nav.on svg{ color:var(--accent-ink); }
  .nav .k{ margin-left:auto; font-size:10.5px; color:var(--ter); font-family:var(--mono); }
  .side-label{ font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ter); padding:16px 9px 5px; }

  /* main */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .titlebar{ display:flex; align-items:center; gap:14px; padding:14px 26px 12px; border-bottom:1px solid var(--sep2); }
  .titlebar h1{ margin:0; font-size:23px; font-weight:700; letter-spacing:-.03em; min-width:0; }
  .titlebar .sub{ font-size:12.5px; color:var(--ter); }
  .tb-actions{ margin-left:auto; display:flex; align-items:center; gap:9px; }
  .search{ display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--sep2); border-radius:9px; padding:6px 11px; width:230px; color:var(--ter); }
  .search input{ background:none; border:none; outline:none; color:var(--text); width:100%; }
  .search .kbd{ font-family:var(--mono); font-size:10px; color:var(--ter); border:1px solid var(--sep); border-radius:4px; padding:1px 4px; }
  .ibtn{ width:31px; height:31px; border-radius:8px; display:grid; place-items:center; color:var(--sec); border:1px solid var(--sep); }
  .ibtn:hover{ background:var(--panel2); color:var(--text); }
  .ibtn.on{ background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); }
  .avatar{ width:29px; height:29px; border-radius:50%; background:linear-gradient(150deg,#ff9f0a,#ff375f); }

  .content{ flex:1; overflow-y:auto; padding:22px 26px 40px; }
  .card{ background:var(--panel); border:1px solid var(--sep); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm); }
  .card h4{ margin:0 0 12px; font-size:12px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--ter); display:flex; align-items:center; gap:8px; }
  .card h4 .sp{ margin-left:auto; text-transform:none; letter-spacing:0; font-size:12px; color:var(--accent-ink); cursor:pointer; }
  .dash{ display:grid; grid-template-columns:repeat(12,1fr); gap:15px; }
  .c3{ grid-column:span 3; } .c4{ grid-column:span 4; } .c5{ grid-column:span 5; } .c6{ grid-column:span 6; } .c7{ grid-column:span 7; } .c8{ grid-column:span 8; } .c12{ grid-column:span 12; }
  .hide{ display:none !important; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; background:var(--panel2); border:1px solid var(--sep); color:var(--sec); }
  .badge.on{ background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); }
  .badge.good{ background:rgba(48,164,108,.15); border-color:transparent; color:var(--good); }
  .badge.warn{ background:rgba(229,165,10,.15); border-color:transparent; color:var(--warn); }
  .badge.bad{ background:rgba(229,72,77,.15); border-color:transparent; color:var(--bad); }
  .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .hero{ position:relative; overflow:hidden; border-radius:16px; min-height:250px; grid-column:span 8; box-shadow:var(--shadow); }
  .hero .art{ position:absolute; inset:0; background-size:cover; }
  .hero .veil{ position:absolute; inset:0; background:linear-gradient(90deg,rgba(0,0,0,.66),rgba(0,0,0,.08) 60%); }
  .hero .depth{ position:absolute; inset:0; z-index:3; pointer-events:none; background-size:cover; background-position:center;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-size:auto 74%; mask-size:auto 74%; -webkit-mask-position:76% 24%; mask-position:76% 24%;
    filter:drop-shadow(0 22px 40px rgba(0,0,0,.5)) brightness(1.06); }
  .hero .hb{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:22px 24px; color:#fff; }
  .hero .tag{ font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; opacity:.85; }
  .hero h2{ margin:7px 0 4px; font-size:29px; font-weight:700; letter-spacing:-.03em; }
  .hero .sub{ font-size:14px; opacity:.85; margin-bottom:12px; }
  .hero .row{ display:flex; align-items:center; gap:8px; }
  .hero .badges{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .hero .badges .badge{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.18); color:#fff; backdrop-filter:blur(8px); }
  .hero .play{ position:absolute; right:24px; bottom:24px; z-index:4; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.95); color:#111; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .hero .play svg{ width:21px; height:21px; }

  .list{ display:flex; flex-direction:column; }
  .trow{ display:flex; align-items:center; gap:12px; padding:8px 6px; border-radius:9px; cursor:pointer; }
  .trow:hover{ background:var(--panel2); }
  .trow .cv{ width:38px; height:38px; border-radius:7px; background-size:cover; flex:0 0 auto; }
  .trow .m{ min-width:0; flex:1; }
  .trow .m b{ display:block; font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trow .m span{ display:block; font-size:12px; color:var(--sec); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trow .rt{ font-size:11.5px; color:var(--ter); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .trow .grip{ color:var(--ter); cursor:grab; width:14px; }
  .trow.playing .m b{ color:var(--accent-ink); }
  .eq{ display:flex; gap:2px; align-items:flex-end; height:13px; width:14px; }
  .eq i{ width:3px; background:var(--accent-ink); border-radius:2px; height:40%; animation:eq .9s ease-in-out infinite; }
  .eq i:nth-child(2){ height:85%; animation-delay:-.2s; } .eq i:nth-child(3){ height:60%; animation-delay:-.4s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(.3); } 50%{ transform:scaleY(1); } }

  .stat b{ display:block; font-size:24px; font-weight:700; letter-spacing:-.03em; }
  .stat span{ font-size:11.5px; color:var(--sec); }
  .stat .spark{ margin-top:6px; }
  .kv{ display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--sep2); }
  .kv:last-child{ border-bottom:none; }
  .kv span{ color:var(--sec); }
  .kv b{ font-weight:500; font-variant-numeric:tabular-nums; }
  .mono{ font-family:var(--mono); font-size:11.5px; }

  .prog{ height:4px; border-radius:4px; background:var(--track); overflow:hidden; }
  .prog i{ display:block; height:100%; background:var(--accent); border-radius:4px; }
  .bar{ height:6px; border-radius:6px; background:var(--track); overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:6px; }

  .heat{ display:grid; grid-template-columns:repeat(24,1fr); gap:3px; }
  .heat i{ aspect-ratio:1; border-radius:2.5px; background:var(--accent); }
  .heat-x{ display:flex; justify-content:space-between; font-size:10px; color:var(--ter); margin-top:6px; }

  /* timeline */
  .tl-wrap{ position:relative; height:150px; }
  .tl-track{ position:absolute; top:0; bottom:0; left:0; right:0; }
  .tl-bar{ position:absolute; top:26px; height:56px; border-radius:9px; overflow:hidden; background:var(--panel2); border:1px solid var(--sep); }
  .tl-bar .fill{ position:absolute; inset:0; width:0; background:linear-gradient(90deg,var(--accent-soft),rgba(10,132,255,.05)); }
  .tl-bar .lab{ position:relative; z-index:2; padding:8px 10px; font-size:11.5px; white-space:nowrap; overflow:hidden; }
  .tl-bar .lab b{ display:block; font-size:12.5px; font-weight:600; }
  .tl-bar .lab span{ color:var(--sec); font-size:11px; }
  .tl-bar.cur{ border-color:var(--accent); }
  .tl-bar.next{ opacity:.95; }
  .tl-overlap{ position:absolute; top:26px; height:56px; background:repeating-linear-gradient(45deg,rgba(10,132,255,.22),rgba(10,132,255,.22) 6px,transparent 6px,transparent 12px); border-radius:9px; z-index:3; pointer-events:none; }
  .tl-seam{ position:absolute; top:18px; height:72px; width:3px; background:var(--warn); border-radius:3px; cursor:ew-resize; z-index:5; }
  .tl-seam::after{ content:""; position:absolute; top:-6px; left:-6px; width:15px; height:15px; border-radius:50%; background:var(--warn); box-shadow:0 0 0 3px var(--bg); }
  .tl-lab{ position:absolute; z-index:6; background:var(--raise); border:1px solid var(--sep); border-radius:8px; padding:4px 9px; font-size:11.5px; font-weight:600; box-shadow:var(--shadow-sm); white-space:nowrap; }
  .tl-axis{ position:absolute; bottom:4px; left:0; right:0; display:flex; justify-content:space-between; font-size:10px; color:var(--ter); }
  .tl-hint{ font-size:12px; color:var(--sec); margin-top:10px; }

  .chips{ display:flex; gap:7px; flex-wrap:wrap; }
  .chip{ padding:5px 12px; border-radius:999px; background:var(--panel2); border:1px solid var(--sep); font-size:12.5px; color:var(--sec); cursor:pointer; }
  .chip:hover{ color:var(--text); }
  .chip.on{ background:var(--accent); border-color:transparent; color:#fff; }
  .chip.saved{ border-style:dashed; }

  .seg{ display:flex; gap:2px; padding:2px; border-radius:9px; background:var(--panel2); }
  .seg button{ padding:5px 12px; border-radius:7px; font-size:12.5px; font-weight:500; color:var(--sec); }
  .seg button.on{ background:var(--panel); color:var(--text); box-shadow:var(--shadow-sm); }

  .grid2{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .acard .cover{ width:100%; aspect-ratio:1; border-radius:11px; background-size:cover; margin-bottom:8px; box-shadow:var(--shadow-sm); transition:transform .18s; }
  .acard:hover .cover{ transform:translateY(-3px); }
  .acard b{ display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acard span{ display:block; font-size:11.5px; color:var(--sec); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .chain{ display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:6px 0; }
  .stage{ flex:0 0 auto; min-width:118px; background:var(--panel2); border:1px solid var(--sep); border-radius:11px; padding:11px; }
  .stage.on{ border-color:var(--accent); background:var(--accent-soft); }
  .stage.off{ opacity:.45; }
  .stage b{ display:block; font-size:12.5px; font-weight:600; margin-bottom:3px; }
  .stage span{ font-size:11px; color:var(--sec); }
  .stage .st{ display:inline-block; margin-top:7px; font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ter); }
  .stage.on .st{ color:var(--accent-ink); }
  .conn{ flex:0 0 auto; width:26px; display:grid; place-items:center; color:var(--ter); }
  .conn.warn{ color:var(--warn); }
  .conn svg{ width:16px; height:16px; }

  .wave{ display:flex; align-items:center; gap:1.5px; height:70px; }
  .wave i{ flex:1; background:var(--accent); border-radius:1px; opacity:.75; min-height:2px; }
  .wave.mirror i{ align-self:center; }

  .pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .kv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }
  .tabbar{ display:flex; gap:3px; border-bottom:1px solid var(--sep2); margin-bottom:14px; }
  .tab{ padding:7px 12px; font-size:12.5px; font-weight:500; color:var(--sec); border-bottom:2px solid transparent; cursor:pointer; margin-bottom:-1px; }
  .tab.on{ color:var(--text); border-color:var(--accent); }
  .note{ background:var(--panel2); border:1px solid var(--sep2); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--sec); }
  .empty{ text-align:center; color:var(--ter); padding:40px 0; }
  .srow{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--sep2); }
  .srow:last-child{ border-bottom:none; }
  .srow .ic{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; flex:0 0 auto; }
  .srow .m{ flex:1; min-width:0; }
  .srow .m b{ display:block; font-size:12.5px; font-weight:500; }
  .srow .m span{ font-size:11.5px; color:var(--sec); }

  /* discover reel */
  .reel{ display:flex; flex-direction:column; gap:16px; }
  .panel{ position:relative; height:340px; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; }
  .panel .art{ position:absolute; inset:0; background-size:cover; }
  .panel .sh{ position:absolute; inset:0; background:linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,.04) 58%); }
  .panel .m{ position:absolute; left:24px; bottom:22px; color:#fff; z-index:2; }
  .panel .m .tag{ font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; opacity:.85; }
  .panel .m h2{ margin:6px 0 3px; font-size:28px; font-weight:700; letter-spacing:-.03em; }
  .panel .m p{ margin:0 0 10px; font-size:13.5px; opacity:.85; }
  .panel .play{ position:absolute; right:24px; bottom:22px; z-index:2; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.95); color:#111; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.35); }

  /* now playing */
  .np{ display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start; }
  .np-art{ position:relative; aspect-ratio:1; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
  .np-art .art{ position:absolute; inset:0; background-size:cover; }
  .np-art .depth{ position:absolute; inset:0; background-size:cover; background-position:center;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-size:auto 78%; mask-size:auto 78%; -webkit-mask-position:70% 26%; mask-position:70% 26%;
    filter:drop-shadow(0 26px 46px rgba(0,0,0,.5)) brightness(1.06); }

  /* overlays */
  .overlay{ position:fixed; inset:0; z-index:60; display:none; }
  .overlay.show{ display:block; }
  .scrim{ position:absolute; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .palette{ position:absolute; left:50%; top:14%; transform:translateX(-50%); width:min(620px,92vw); background:var(--raise); border:1px solid var(--sep); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .palette input{ width:100%; border:none; outline:none; background:none; color:var(--text); padding:15px 17px; font-size:15px; border-bottom:1px solid var(--sep2); }
  .palette .res{ max-height:52vh; overflow-y:auto; padding:6px; }
  .palette .item{ display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; cursor:pointer; font-size:13.5px; }
  .palette .item:hover, .palette .item.sel{ background:var(--accent-soft); }
  .palette .item .grp{ margin-left:auto; font-size:11px; color:var(--ter); }
  .palette .empty{ padding:22px; }

  .wizard{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(680px,94vw); background:var(--raise); border:1px solid var(--sep); border-radius:18px; box-shadow:var(--shadow); padding:26px 28px; }
  .wizard .stepdots{ display:flex; gap:6px; margin-bottom:16px; }
  .wizard .stepdots i{ width:7px; height:7px; border-radius:50%; background:var(--track); }
  .wizard .stepdots i.on{ background:var(--accent); width:20px; border-radius:4px; }
  .wizard h2{ margin:0 0 6px; font-size:24px; letter-spacing:-.03em; }
  .wizard p{ margin:0 0 18px; color:var(--sec); font-size:13.5px; }
  .wizard .opts{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt{ border:1px solid var(--sep); border-radius:12px; padding:14px; cursor:pointer; }
  .opt:hover{ background:var(--panel2); }
  .opt.on{ border-color:var(--accent); background:var(--accent-soft); }
  .opt b{ display:block; font-size:13.5px; margin-bottom:3px; }
  .opt span{ font-size:12px; color:var(--sec); }
  .wizard .foot{ display:flex; align-items:center; gap:10px; margin-top:22px; }
  .btn{ padding:8px 16px; border-radius:9px; font-size:13px; font-weight:600; }
  .btn.pri{ background:var(--accent); color:#fff; }
  .btn.ghost{ border:1px solid var(--sep); color:var(--sec); }
  .btn.ghost:hover{ color:var(--text); }

  .imm{ position:fixed; inset:0; z-index:70; background:#000; display:none; overflow:hidden; }
  .imm.show{ display:block; }
  .imm .art{ position:absolute; inset:0; background-size:cover; filter:blur(40px) brightness(.5); transform:scale(1.2); }
  .imm .center{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; color:#fff; }
  .imm .cover{ width:min(38vh,340px); aspect-ratio:1; border-radius:18px; background-size:cover; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .imm h2{ margin:0; font-size:32px; letter-spacing:-.03em; }
  .imm .ctl{ opacity:0; transition:opacity .3s; display:flex; align-items:center; gap:16px; }
  .imm:hover .ctl, .imm .ctl.show{ opacity:1; }

  .mini{ position:fixed; right:16px; bottom:104px; z-index:50; width:300px; background:var(--raise); border:1px solid var(--sep); border-radius:14px; box-shadow:var(--shadow); padding:12px; display:none; }
  .mini.show{ display:block; }

  /* now bar */
  .nowbar{ position:fixed; left:0; right:0; bottom:0; height:92px; display:flex; align-items:center; gap:18px; padding:0 20px;
    background:var(--sidebar); backdrop-filter:saturate(160%) blur(24px); -webkit-backdrop-filter:saturate(160%) blur(24px); border-top:1px solid var(--sep); z-index:40; }
  .nowbar .thumb{ width:56px; height:56px; border-radius:10px; background-size:cover; flex:0 0 auto; box-shadow:var(--shadow-sm); }

  function dash(){ var preset=state.dashPreset, h=state.hidden;

    cards.push({k:"shuffle",h:card("Smart Shuffle","c6",'<div style="display:flex;gap:12px;align-items:center"><div style="flex:1"><b style="font-size:15px">Kerala</b><div style="color:var(--sec);font-size:12.5px;margin:2px 0 10px">Bonobo · Migration</div>'+

    cards.push({k:"pulse",h:card("Library Pulse","c4",'<div class="stat"><b>1,204</b><span>tracks · 96 albums · 58 artists</span></div><div class="kv" style="margin-top:10px"><span>Total size</span><b>41.2 GB</b></div><div class="kv"><span>Last added</span><b>2 days ago</b></div>')});

      '<div class="srow"><span class="ic badge warn">34</span><div class="m"><b>Missing artwork</b><span>no embedded or sidecar cover</span></div></div>'+
      '<div class="srow"><span class="ic badge">7</span><div class="m"><b>Stale depth cache</b><span>art changed since mask computed</span></div></div>')});
    cards.push({k:"quality",h:card("Audio Quality","c4",'<div style="font-size:12px;color:var(--sec);margin-bottom:6px">Format</div>'+barSeg([["FLAC",62,"var(--accent)"],["ALAC",18,"var(--violet)"],["MP3",20,"var(--warn)"]])+
      '<div style="font-size:12px;color:var(--sec);margin:12px 0 6px">Sample rate</div>'+barSeg([["44.1",34,"var(--accent)"],["48",48,"var(--violet)"],["96",18,"var(--good)"]])+
      '<div style="font-size:12px;color:var(--sec);margin:12px 0 6px">Bit depth</div>'+barSeg([["16-bit",52,"var(--accent)"],["24-bit",48,"var(--good)"]])+
      '<div style="font-size:11px;color:var(--ter);margin-top:10px">Click a segment to filter Browse</div>')});
    cards.push({k:"heat",h:card("Listening Heatmap","c12",heatmap()+'<div class="heat-x"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div><div style="font-size:11.5px;color:var(--ter);margin-top:8px">Local-only. Never leaves this machine.</div>')});
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div class="seg" id="presetSeg">'+
      ["Minimal","Default","Power User","Audio Nerd","Immersion"].map(function(p){ return '<button data-preset="'+p+'"'+(p===preset?' class="on"':'')+'>'+p+'</button>'; }).join("")+
      '</div><span style="font-size:11.5px;color:var(--ter)">Dashboard layout — show/hide, reorder, resize, saved presets</span></div>'+
      '<div class="dash">'+cards.filter(function(c){ return show(c.k); }).map(function(c){ return c.h; }).join("")+'</div>'; }
  function card(title,cls,body){ return '<section class="card '+cls+'"><h4>'+title+'<span class="sp" data-customize="1">Customize</span></h4>'+body+'</section>'; }

  function heatmap(){ var out=""; for(var d=0;d<7;d++) for(var hr=0;hr<24;hr++){ var v=hash(d*31+hr*7+3); out+='<i style="opacity:'+(0.08+v*0.9).toFixed(2)+'"></i>'; } return '<div class="heat">'+out+'</div>'; }

  /* ---------- views: now playing / discover ---------- */

      '<div class="card"><h4>Notes & Bookmarks</h4><div class="note">“The bridge at 1:48 — check the reverb tail.”</div>'+

  function discover(){ return '<div class="reel">'+ALBUMS.slice(0,6).map(function(a,i){

  /* ---------- views: timeline / queue / lyrics ---------- */
  function timeline(){ var cur=T(state.cur), nx=T((state.cur+1)%LIB.length), fo=T((state.cur+2)%LIB.length);
    return '<div class="card" style="margin-bottom:15px"><h4>Rolling Timeline — duration-proportional</h4>'+
      '<div class="tl-wrap" id="tlWrap"><div class="tl-track" id="tlTrack"></div></div>'+
      '<div class="tl-hint">Drag the amber seam to set the crossfade for this session. The engine receives the new value; the next transition uses it. No Settings page required.</div>'+
      '<div style="display:flex;gap:8px;margin-top:12px;align-items:center"><span class="badge" id="tlXf">Crossfade '+state.xf.toFixed(1)+'s</span><span class="badge" id="tlFade">Fade 0%</span>'+
      '<span style="flex:1"></span><button class="btn ghost" data-tlreset="1">Reset to default ('+state.xfDefault.toFixed(1)+'s)</button><button class="btn ghost" data-tlsave="1">Save as default</button></div></div>'+
      '<div class="card" style="margin-bottom:15px"><h4>Crossfade Curve</h4><div class="seg" id="curveSeg" style="width:max-content"><button class="on" data-curve="1">Equal-power</button><button data-curve="1">Linear</button><button data-curve="1">Custom</button></div>'+

  function curveSVG(){ var p=[]; for(var x=0;x<=100;x+=2){ var y=100-Math.sin(x/100*Math.PI/2)*100; p.push(x.toFixed(0)+","+y.toFixed(1)); }
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:110px"><polyline points="'+p.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>'; }
  function queue(){ var secs=[["Current album",[state.cur,(state.cur+1)%LIB.length,(state.cur+2)%LIB.length]],["Manually added",[5,9]],["Smart queue additions",[6,7,11]]];

  function lyrics(){ var lines=[["0:00","The red thread runs through everything"],["0:22","A line I follow without seeing"],["0:47","Past the fields, past the quiet towns"],["1:15","Where the signal starts to fade"],["1:48","And the bridge opens like a room"],["2:20","I keep the light on for the sound"],["2:55","The red thread runs through everything"],["3:30","And pulls me home again"]];

      '<div><div class="card" style="margin-bottom:13px"><h4>Playback</h4><div class="kv"><span>Follow playback</span><b id="lyFollow">'+(state.lyricsFollow?"On":"Off")+'</b></div>'+

      '<div class="card"><h4>Actions</h4><div class="pills"><span class="chip">Click to seek</span><span class="chip">Save corrected timing</span><span class="chip">Fullscreen lyrics</span><span class="chip">Auto-scroll</span></div></div></div></div>'; }

  /* ---------- views: browse / map / inspect / maintenance ---------- */
  function filtered(){ var q=state.q.trim().toLowerCase(); return LIB.map(function(t,i){ return i; }).filter(function(i){ var t=T(i);
    if(q && (t.title+" "+t.artist+" "+t.album+" "+t.genre+" "+t.fmt).toLowerCase().indexOf(q)<0) return false;

    else if(state.lens==="Artists") body='<div class="grid2">'+ALBUMS.slice(0,4).map(function(a,i){ return '<div class="acard"><div class="cover" style="background-image:'+art(i)+';border-radius:50%"></div><b>'+esc(a[1])+'</b><span>'+LIB.filter(function(t){ return t[1]===a[1]; }).length+' tracks</span></div>'; }).join("")+'</div>';
    else if(state.lens==="Genres") body='<div class="grid2">'+["Electronic","Techno","Ambient","Downtempo","Modern Classical"].map(function(g,i){ return '<div class="acard" data-genre="'+g+'"><div class="cover" style="background-image:'+art(i)+'"></div><b>'+g+'</b><span>'+LIB.filter(function(t){ return t[8]===g; }).length+' tracks</span></div>'; }).join("")+'</div>';
    else if(state.lens==="Years") body='<div class="grid2">'+[2026,2025,2024,2023,2016,2013,2011,2009,1978].map(function(y,i){ return '<div class="acard"><div class="cover" style="background-image:'+art(i)+'"></div><b>'+y+'</b><span>'+LIB.filter(function(t){ return t[9]===y; }).length+' tracks</span></div>'; }).join("")+'</div>';
    else if(state.lens==="Formats") body='<div class="grid2">'+[["FLAC",1],["ALAC",1],["MP3",0]].map(function(f,i){ return '<div class="acard" data-format="'+f[0]+'"><div class="cover" style="background-image:'+art(i)+'"></div><b>'+f[0]+'</b><span>'+(f[1]?"lossless":"lossy")+'</span></div>'; }).join("")+'</div>';
    else body='<div class="card"><div class="mono" style="color:var(--sec)">Music/</div>'+['Mira Vale/','  Forms of Silence/','    01 Red Thread.flac','    10 Horizon.flac','North Index/','  Intervals/','    02 Afterimage.flac','Ana Lune/','  Soft Machines/','    03 Still Water.m4a'].map(function(x){ return '<div class="mono" style="padding:5px 0;border-bottom:1px solid var(--sep2)">'+esc(x)+'</div>'; }).join("")+'</div>';
    return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap"><div class="seg" id="lensSeg">'+lens.map(function(l){ return '<button data-lens="'+l+'"'+(l===state.lens?' class="on"':'')+'>'+l+'</button>'; }).join("")+'</div>'+
      '<span class="chip'+(state.filter==="Lossless"?" on":"")+'" data-filter="Lossless">Lossless only</span>'+
      '<span class="chip saved" data-saved="1">+ Saved view</span><span style="font-size:11.5px;color:var(--ter)">Filter persists across lenses</span></div>'+
      '<div style="font-size:12px;color:var(--ter);margin-bottom:10px">'+ids.length+' of '+LIB.length+' tracks · lens: '+state.lens+'</div>'+body; }
  function map(){ var nodes=[["Artist","Mira Vale",12,50,22],["Album","Forms of Silence",38,50,27],["Track","Red Thread",64,28,20],["Track","Horizon",64,72,20],["File","01 Red Thread.flac",88,28,23],["File","10 Horizon.flac",88,72,23]];
    return '<div class="card"><h4>Music Map — real relationships only</h4><svg viewBox="0 0 100 100" style="width:100%;height:380px">'+

  function inspect(){ var t=T(state.cur); var tabs=["metadata","filesystem","technical"];

      '<div style="font-size:12px;color:var(--ter);margin-bottom:6px">Theme</div><div class="opts">'+
      ["Dark","Light","System","OLED"].map(function(t){ return '<div class="opt'+(wiz.theme===t?' on':'')+'" data-wiz="theme:'+t+'"><b>'+t+'</b><span>'+(t==="OLED"?"True black for OLED panels":t==="System"?"Follow the desktop":"")+'</span></div>'; }).join("")+'</div>'+
      '<div style="font-size:12px;color:var(--ter);margin:14px 0 6px">Motion</div><div class="seg" data-seg="wizmotion">'+["Full","Reduced","Minimal"].map(function(m){ return '<button data-segv="'+m+'"'+(wiz.motion===m?' class="on"':'')+'>'+m+'</button>'; }).join("")+'</div>';
      foot='<button class="btn ghost" data-wizback="1">Back</button><button class="btn pri" data-wiznext="1">Continue</button>'; }
    else { body='<h2>Where is your music?</h2><p>Echo scans this folder to build its local index. Change it later from Settings.</p>'+
      '<div class="note mono" style="font-size:13px">'+esc(wiz.folder)+'</div><div class="opts" style="margin-top:12px"><div class="opt on"><b>~/Music</b><span>12,480 files · 41.2 GB</span></div><div class="opt"><b>Choose another folder…</b><span>Any local or mounted path</span></div></div>';
      foot='<button class="btn ghost" data-wizback="1">Back</button><button class="btn pri" data-wizdone="1">Start using Echo</button>'; }
    w.innerHTML=head+body+'<div class="foot">'+foot+'</div>'; }
  function openImm(){ document.getElementById("imm").classList.add("show"); var w=document.getElementById("immWave"); if(!w.children.length){ for(var i=0;i<56;i++){ var e=document.createElement("i"); e.style.height=(20+hash(i*1.6)*75)+"%"; w.appendChild(e); } } renderDock(); }
  function closeImm(){ document.getElementById("imm").classList.remove("show"); }
  function flashbang(){ var f=document.getElementById("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
  function setTheme(t){ document.documentElement.dataset.theme=t; }

  /* ---------- global events ---------- */
  document.addEventListener("click",function(e){
    var n=e.target.closest("[data-view],[data-play],[data-album],[data-toggle],[data-go],[data-preset],[data-lens],[data-filter],[data-tab],[data-viz],[data-segv],[data-act],[data-wiz],[data-wiznext],[data-wizback],[data-wizdone],[data-close],[data-resume],[data-saved],[data-customize],[data-seek],[data-genre],[data-format],[data-tlreset],[data-tlsave],[data-curve],[data-scan],[data-flash],[data-ab],[data-abseg],[data-pal],[data-wizard]");
    if(!n){ return; }
    var g=function(a){ return n.getAttribute(a); };
    if(g("data-pal")!==null){ openPalette(); return; }
    if(g("data-wizard")!==null){ openWizard(); return; }
    if(g("data-flash")!==null){ flashbang(); return; }
    if(g("data-ab")!==null){ state.ab=!state.ab; render(); return; }
    if(g("data-abseg")!==null){ n.parentElement.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on",b===n); }); return; }
    if(g("data-curve")!==null){ n.parentElement.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on",b===n); }); return; }
    if(g("data-tlreset")!==null){ state.xf=state.xfDefault; layoutTimeline(); updateXfLabels(); return; }
    if(g("data-tlsave")!==null){ state.xfDefault=state.xf; n.textContent="Saved"; return; }
    if(g("data-scan")!==null){ runScan(); return; }
    if(g("data-close")){ closePalette(); return; }
    if(g("data-act")!==null){ runAct(+g("data-act")); return; }
    if(g("data-wiz")){ var p=g("data-wiz").split(":"); wiz[p[0]]=p[1]; renderWizard(); return; }
    if(g("data-wiznext")){ wizStep=Math.min(2,wizStep+1); renderWizard(); return; }
    if(g("data-wizback")){ wizStep=Math.max(0,wizStep-1); renderWizard(); return; }
    if(g("data-wizdone")){ state.xf=wiz.xf==="Crossfade"?6:0; state.xfDefault=state.xf; if(wiz.theme==="Light") setTheme("light"); else if(wiz.theme==="OLED") setTheme("oled"); else setTheme("dark"); state.motion=wiz.motion.toLowerCase(); document.documentElement.dataset.motion=state.motion; state.onboarding=false; document.getElementById("wizardOverlay").classList.remove("show"); setView("home"); return; }
    if(g("data-segv")!==null){ var seg=n.parentElement, id=seg.getAttribute("data-seg"); seg.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on",b===n); }); if(id==="theme"){ if(n.getAttribute("data-segv")==="Light"){ flashbang(); setTheme("light"); } else if(n.getAttribute("data-segv")==="OLED"){ setTheme("oled"); } else setTheme("dark"); } else if(id==="accent"){ state.accent=n.getAttribute("data-segv"); } else if(id==="motion"){ state.motion=n.getAttribute("data-segv").toLowerCase(); document.documentElement.dataset.motion=state.motion; } else if(id==="transition"){ state.transition=n.getAttribute("data-segv"); } else if(id==="art"){ state.artMode=n.getAttribute("data-segv"); } else if(id==="visual"){ state.visual=n.getAttribute("data-segv"); } else if(id==="light"){ state.lightTransition=n.getAttribute("data-segv"); } else if(id==="wizmotion"){ wiz.motion=n.getAttribute("data-segv"); } return; }
    if(g("data-viz")){ state.visual=g("data-viz"); render(); return; }
    if(g("data-tab")){ state.inspectTab=g("data-tab"); render(); return; }
    if(g("data-filter")){ state.filter=state.filter==="Lossless"?null:"Lossless"; render(); return; }
    if(g("data-lens")){ state.lens=g("data-lens"); render(); return; }
    if(g("data-preset")){ state.dashPreset=g("data-preset"); render(); return; }
    if(g("data-resume")){ playTrack(0); return; }
    if(g("data-customize")){ setView("appearance"); return; }
    if(g("data-go")){ setView(g("data-go")); return; }
    if(g("data-toggle")!==null){ toggle(); return; }
    if(g("data-play")!==null){ playTrack(+g("data-play")); return; }
    if(g("data-album")!==null){ playTrack(LIB.findIndex(function(t){ return t[10]===+g("data-album"); })); return; }
    if(g("data-view")){ setView(g("data-view")); return; }
  });
  document.getElementById("prevBtn").addEventListener("click",function(){ step(-1); });
  document.getElementById("nextBtn").addEventListener("click",function(){ step(1); });
  document.getElementById("dockPlay").addEventListener("click",toggle);
  document.getElementById("miniPlay").addEventListener("click",toggle);
  document.getElementById("immPrev").addEventListener("click",function(){ step(-1); });
  document.getElementById("immNext").addEventListener("click",function(){ step(1); });
  document.getElementById("immPlay").addEventListener("click",toggle);
  document.getElementById("theme").addEventListener("click",function(){ var t=document.documentElement.dataset.theme; if(t==="dark"){ flashbang(); setTheme("light"); } else if(t==="light"){ setTheme("oled"); } else { setTheme("dark"); } });
  document.getElementById("btnImm").addEventListener("click",openImm);
  document.getElementById("imm").addEventListener("click",function(e){ if(e.target.id==="imm"||e.target.classList.contains("center")||e.target.classList.contains("art")) closeImm(); });
  document.getElementById("btnMini").addEventListener("click",function(){ document.getElementById("mini").classList.toggle("show"); this.classList.toggle("on"); });
  document.getElementById("qaHall").addEventListener("click",function(){ state.hall=!state.hall; this.classList.toggle("on",state.hall); if(state.view==="chain"||state.view==="home") render(); });
  document.getElementById("qaShuffle").addEventListener("click",function(){ state.shuffle=!state.shuffle; this.classList.toggle("on",state.shuffle); if(state.view==="queue") render(); });
  document.getElementById("vol").addEventListener("pointerdown",function(e){ var v=e.currentTarget; function set(ev){ var r=v.getBoundingClientRect(); var x=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)); v.firstElementChild.style.width=(x*100)+"%"; } set(e); function mv(ev){ set(ev); } function up(){ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); } document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up); });
  document.getElementById("bars").addEventListener("click",function(e){ var r=e.currentTarget.getBoundingClientRect(); state.pos=Math.min(0.999,Math.max(0,(e.clientX-r.left)/r.width))*T(state.cur).dur; });
  document.getElementById("search").addEventListener("input",function(e){ state.q=e.target.value; if(state.view!=="browse") state.view="browse"; render(); });
  document.getElementById("palInput").addEventListener("input",function(e){ renderPalette(e.target.value); });
  document.getElementById("palInput").addEventListener("keydown",function(e){ if(e.key==="Enter"){ var sel=document.querySelector("#palRes .item.sel")||document.querySelector("#palRes .item"); if(sel) runAct(+sel.getAttribute("data-act")); } });
  document.addEventListener("keydown",function(e){
    var mod=e.metaKey||e.ctrlKey;
    if(mod && (e.key==="k"||e.key==="K")){ e.preventDefault(); openPalette(); return; }
    if(e.key==="Escape"){ closePalette(); closeImm(); return; }
    if(e.key==="F11"){ e.preventDefault(); openImm(); return; }
    if(e.target.tagName==="INPUT") return;
    if(e.key===" "){ e.preventDefault(); toggle(); }
    else if(e.key==="ArrowRight"){ state.pos=Math.min(T(state.cur).dur-1,state.pos+5); }
    else if(e.key==="ArrowLeft"){ state.pos=Math.max(0,state.pos-5); }
    else if(e.key==="n"||e.key==="N"){ step(1); } else if(e.key==="p"||e.key==="P"){ step(-1); }
    else if(e.key==="s"||e.key==="S"){ state.shuffle=!state.shuffle; }
  });
  window.addEventListener("resize",function(){ if(state.view==="timeline") layoutTimeline(); });

  /* ---------- boot ---------- */
  try{ var qv=new URLSearchParams(location.search).get("view"); if(qv && TITLES[qv]) state.view=qv; }catch(e){}
  window.__echo={ state:state, setView:setView, render:render, play:playTrack, toggle:toggle, openPalette:openPalette, openWizard:openWizard, openImm:openImm };
  buildSidebar(); buildRing(); buildBars(); render(); renderDock();
  requestAnimationFrame(loop); loop(performance.now());
})();
</script>
</body>
</html>
